[project]
name = "fortune-telling"
version = "0.1.0"
description = "한국식 사주명리부터 시작하는 멀티 운세 FastAPI 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
    "korean-lunar-calendar>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
